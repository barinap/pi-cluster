apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kan
resources:
  - ../../base/kan
  - ingress.yaml
  - minio-ingress.yaml
  - kan-secret.sops.yaml
  - kan-s3-secret.sops.yaml
  - minio-root-secret.sops.yaml
  - tasks-storage-tls-secret.sops.yaml
  - tasks-tls-secret.sops.yaml
# MinIO community images were removed from Docker Hub (pull access denied).
# Pin to the exact image already cached on rpinode1/rpinode2
# (RELEASE.2025-09-07T16-13-09Z, the version that wrote the data) and never re-pull.
images:
  - name: minio/minio
    newName: docker.io/minio/minio
    digest: sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
patches:
  - target:
      kind: StatefulSet
      name: minio
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
