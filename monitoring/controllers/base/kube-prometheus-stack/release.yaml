apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.17.0"

      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    # k3s embeds controller-manager, scheduler, and kube-proxy — no separate scrape endpoints
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    # k3s apiserver does not expose the standard Prometheus scrape endpoint
    kubeApiServer:
      enabled: false

    prometheus:
      prometheusSpec:
        # LUN balance: prefer a different node than Nextcloud (2 LUNs), see apps/base/nextcloud
        # (the chart's built-in podAntiAffinity must be off, otherwise duplicate key)
        podAntiAffinity: ""
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 2Gi
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  namespaces:
                    - nextcloud
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: nextcloud
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: synology-iscsi
              accessModes: [ "ReadWriteOnce" ]
              resources:
                requests:
                  storage: 10Gi

    prometheusOperator:
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
        limits:
          memory: 256Mi

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 192Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 96Mi

    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        alertmanagerConfigMatcherStrategy:
          type: None
        # No PVC since 2026-11-02 (emptyDir; saves an iSCSI LUN – DS120j max 10).
        # Only silences + notification log live here; they are lost on pod restart.

    grafana:
      resources:
        requests:
          cpu: 50m
          memory: 384Mi
        limits:
          memory: 1Gi
      sidecar:
        resources:
          requests:
            cpu: 5m
            memory: 128Mi
          limits:
            memory: 384Mi
      deploymentStrategy:
        type: Recreate
      # No PVC since 2026-11-02 (saves an iSCSI LUN – DS120j max 10). State (users, prefs) lives in
      # Postgres pg-cluster (DB/role grafana, CNPG backups); dashboards come from ConfigMaps via the sidecar
      # (monitoring/configs/staging/kube-prometheus-stack/dashboards), admin from secret grafana-admin.
      persistence:
        enabled: false
      envFromSecret: grafana-db   # GF_DATABASE_USER / GF_DATABASE_PASSWORD (SOPS)
      grafana.ini:
        database:
          type: postgres
          host: pg-cluster-rw.cnpg-cluster.svc.cluster.local:5432
          name: grafana
          ssl_mode: require
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      ingress:
        ## If true, Grafana Ingress will be created
        ##
        enabled: true

        ## IngressClassName for Grafana Ingress.
        ## Should be provided if Ingress is enable.
        ##
        ingressClassName: traefik


        ## Hostnames.
        ## Must be provided if Ingress is enable.
        ##
        hosts:
          - grafana.barina.tech

        ## Path for grafana ingress
        path: /

        ## TLS configuration for grafana Ingress
        ## Secret must be manually created in the namespace
        ##
        tls:
          - secretName: grafana-tls-secret
            hosts:
            - grafana.barina.tech    
