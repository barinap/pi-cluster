apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      securityContext:
        fsGroup: 33 # www-data group ID
        runAsUser: 33 # www-data user ID
        runAsGroup: 33 # www-data group ID

      containers:
        - name: linkding
          image: sissbruecker/linkding:1.47.0
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
          ports:
            - containerPort: 9090

          # Data in Postgres pg-cluster (DB/role linkding) since 2026-11-02 – no PVC (saves an iSCSI LUN).
          env:
            - name: LD_DB_ENGINE
              value: postgres
            - name: LD_DB_HOST
              value: pg-cluster-rw.cnpg-cluster.svc.cluster.local
            - name: LD_DB_PORT
              value: "5432"
            - name: LD_DB_DATABASE
              value: linkding
          envFrom:
           # - configMapRef:
           #     name: linkding-configmap
            - secretRef:
                name: linkding-container-env
            - secretRef:
                name: linkding-db          # LD_DB_USER / LD_DB_PASSWORD

          securityContext:
            allowPrivilegeEscalation: false

          volumeMounts:
            - name: linkding-data
              mountPath: /etc/linkding/data
            - name: linkding-secretkey
              mountPath: /etc/linkding/data/secretkey.txt
              subPath: secretkey.txt
              readOnly: true
      volumes:
        # only favicons/previews cache + huey task queue (tasks.sqlite3) – ephemeral
        - name: linkding-data
          emptyDir:
            sizeLimit: 512Mi
        - name: linkding-secretkey
          secret:
            secretName: linkding-secretkey
