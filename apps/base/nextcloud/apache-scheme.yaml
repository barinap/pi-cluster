apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-apache-scheme
data:
  # TLS terminates at Cloudflare; Apache itself only sees plain HTTP. The .htaccess redirects
  # (/.well-known/caldav|carddav -> /remote.php/dav/) are therefore emitted as http:// URLs,
  # which breaks iOS/DAV client setup. Rewrite the scheme in Location when the proxy says https.
  proxy-scheme.conf: |
    <IfModule mod_headers.c>
      Header always edit Location "^http://office\.barina\.tech/" "https://office.barina.tech/" "expr=%{HTTP:X-Forwarded-Proto} == 'https'"
    </IfModule>
