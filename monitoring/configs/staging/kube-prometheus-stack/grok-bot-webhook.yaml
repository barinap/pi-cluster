apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: grok-bot-webhook
spec:
  route:
    receiver: grok-bot
    groupBy:
      - namespace
      - alertname
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      - receiver: drop
        matchers:
          - name: alertname
            value: Watchdog
            matchType: "="
      - receiver: drop
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: "="
  receivers:
    - name: drop
    - name: grok-bot
      webhookConfigs:
        - url: https://api2.cursor.sh/automations/webhook/409ddb2b-de6f-5556-8e02-da3b2a5217c0
          sendResolved: true
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: grok-bot-webhook-auth
                key: token
