apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.17.0"

      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    # k3s embeds controller-manager, scheduler, and kube-proxy — no separate scrape endpoints
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    # k3s apiserver does not expose the standard Prometheus scrape endpoint
    kubeApiServer:
      enabled: false

    prometheus:
      prometheusSpec:
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: synology-iscsi
              accessModes: [ "ReadWriteOnce" ]
              resources:
                requests:
                  storage: 10Gi

    alertmanager:
      alertmanagerSpec:
        alertmanagerConfigMatcherStrategy:
          type: None
        # No PVC since 2026-11-02 (emptyDir; saves an iSCSI LUN – DS120j max 10).
        # Only silences + notification log live here; they are lost on pod restart.

    grafana:
      # RWO iSCSI PVC – avoid Multi-Attach during rollout
      deploymentStrategy:
        type: Recreate
      persistence:
        enabled: true
        storageClassName: synology-iscsi
        accessModes: [ "ReadWriteOnce" ]
        size: 5Gi
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      ingress:
        ## If true, Grafana Ingress will be created
        ##
        enabled: true

        ## IngressClassName for Grafana Ingress.
        ## Should be provided if Ingress is enable.
        ##
        ingressClassName: traefik


        ## Hostnames.
        ## Must be provided if Ingress is enable.
        ##
        hosts:
          - grafana.barina.tech

        ## Path for grafana ingress
        path: /

        ## TLS configuration for grafana Ingress
        ## Secret must be manually created in the namespace
        ##
        tls:
          - secretName: grafana-tls-secret
            hosts:
            - grafana.barina.tech    
