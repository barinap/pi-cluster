apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-operator
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./controllers/cnpg-operator
  prune: true
  wait: true
  # smazání této Kustomization nesmí smazat operátor ani CRD
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: flux-system
