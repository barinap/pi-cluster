apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-cluster
spec:
  instances: 2
  # pinned explicitly (operator 1.30.1 default = 18.3)
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  enableSuperuserAccess: true

  # Primary and replica must run on different nodes (previously 'preferred'
  # let both land on one worker).
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  # Requests from measurement (p95 CPU ~50m, max working set ~290Mi, 2026-11). No limits (OOM would kill the DB).
  resources:
    requests:
      cpu: 100m
      memory: 512Mi

  inheritedMetadata:
    labels:
      release: kube-prometheus-stack

  storage:
    size: 5Gi
    storageClass: synology-iscsi

  monitoring:
    enablePodMonitor: true

  # Declarative roles (passwords come from SOPS secrets in this namespace).
  managed:
    roles:
      - name: nextcloud
        ensure: present
        login: true
        passwordSecret:
          name: nextcloud-db-user
      - name: forgejo
        ensure: present
        login: true
        passwordSecret:
          name: forgejo-db-user
      - name: grafana
        ensure: present
        login: true
        passwordSecret:
          name: grafana-db-user
      - name: linkding
        ensure: present
        login: true
        passwordSecret:
          name: linkding-db-user

  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: cnpg-app-user

  backup:
    retentionPolicy: "30d"
    target: primary
    barmanObjectStore:
      destinationPath: s3://pi-cluster-backup/cnpg
      endpointURL: https://h1t7.fra203.idrivee2-84.com
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-s3-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
