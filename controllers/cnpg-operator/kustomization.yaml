apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cnpg-1.30.1.yaml
patches:
  # Never let Flux prune CRDs (deleting a CRD deletes every Cluster/Backup/... CR and the DB PVCs)
  - target:
      kind: CustomResourceDefinition
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: not-important
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
  - target:
      kind: Namespace
      name: cnpg-system
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: not-important
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
