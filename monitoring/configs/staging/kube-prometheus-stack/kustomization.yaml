apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - grafana-admin.sops.yaml
  - grafana-db.sops.yaml
  - grafana-tls-secret.yaml
  - grok-bot-webhook-auth.sops.yaml
  - grok-bot-webhook.yaml
  - raspberry-pi-node-alerts.yaml

# Custom Grafana dashboards (picked up by the grafana sidecar via label grafana_dashboard=1).
# Grafana has no PVC since 2026-11-02 – every dashboard must live here (GitOps).
configMapGenerator:
  - name: grafana-dashboard-cloudnative-pg
    files:
      - dashboards/cloudnative-pg.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
